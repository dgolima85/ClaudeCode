name: Sincroniza Jogos do Dia

# Botão manual de "forçar sincronização agora" (workflow_dispatch), chamando
# a mesma rota do Cron Jobs da Vercel (ver vercel.json). O agendamento
# automático diário volta a ser responsabilidade só do Cron Jobs da Vercel
# — a causa raiz dele nunca disparar era uma regra de Firewall (ZTNA)
# bloqueando tráfego de fora da rede da empresa, já corrigida (ver
# conversa), não um problema do mecanismo de cron em si. Esse workflow fica
# só como reserva manual, já que o botão "Run" do painel da Vercel se
# mostrou pouco confiável no plano Hobby.
on:
  workflow_dispatch: {}

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Chama a rota de sincronização
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # "Vercel Authentication" (Deployment Protection) foi desligada
          # pra Production — era ela quem bloqueava essa chamada com 403
          # antes mesmo de chegar na nossa rota (ver conversa). A proteção
          # real de quem pode disparar isso é só o CRON_SECRET abaixo.
          status=$(curl -sS -o resposta.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            https://pasagem-turno.vercel.app/api/cron/jogos-do-dia)
          echo "HTTP status: $status"
          cat resposta.json
          echo
          if [ "$status" -ge 400 ]; then
            echo "::error::Sincronização falhou (HTTP $status)"
            exit 1
          fi
