services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Aponte para o seu Postgres (gerenciado ou outro container/serviço).
      DATABASE_URL: "${DATABASE_URL:?defina DATABASE_URL no seu .env (postgresql://user:senha@host:5432/banco)}"
      # Defina como "true" apenas na primeira subida, para popular analistas
      # e listas auxiliares de exemplo. Volte para "false" depois.
      SEED_ON_BOOT: "false"
    restart: unless-stopped
